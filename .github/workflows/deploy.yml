name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: make build

      - name: Test
        run: go test ./internal/...

      - name: Vet
        run: go vet ./...

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: false # disabled until deployment target is ready
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build linux-amd64
        run: make linux-amd64

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            bin/zoom-notifier.linux-amd64 \
            ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/zoom-notifier
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            ${DEPLOY_USER}@${DEPLOY_HOST} \
            'sudo install -p -m0755 /tmp/zoom-notifier /usr/local/bin/zoom-notifier && sudo systemctl restart zoom-notifier'

      - name: Health Check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 5
          curl -sf http://${DEPLOY_HOST}:8888/healthz
