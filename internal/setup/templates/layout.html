{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom-notifier Setup</title>
    <link rel="stylesheet" href="/setup/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="site-title">zoom-notifier</h1>
            <nav class="progress-bar">
                <ol>
                    <li class="{{stepClass 0 .Step}}"><span class="step-number">1</span> Server URL</li>
                    <li class="{{stepClass 1 .Step}}"><span class="step-number">2</span> Zoom</li>
                    <li class="{{stepClass 2 .Step}}"><span class="step-number">3</span> Slack</li>
                    <li class="{{stepClass 3 .Step}}"><span class="step-number">4</span> Advanced</li>
                    <li class="{{stepClass 4 .Step}}"><span class="step-number">5</span> Review</li>
                </ol>
            </nav>
        </header>
        <main>
            {{template "content" .}}
        </main>
        <footer>
            <p>zoom-notifier setup wizard</p>
        </footer>
    </div>
    <script src="/setup/static/setup.js"></script>
</body>
</html>{{end}}
